<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Selected work by Chadrick David." />
    <script>
      (() => {
        const savedTheme = localStorage.getItem("portfolio-theme");
        const preferredTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = savedTheme || preferredTheme;
      })();
    </script>
    <title>Selected Work | Chadrick David</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="project-page.css" />
  </head>
  <body class="case-page">
    <a class="skip-link" href="#case-content">Skip to project</a>

    <header class="case-header">
      <nav class="navbar" aria-label="Project navigation">
        <a href="index.html" class="logo">CHADRICK<span>.</span></a>
        <div class="case-nav-actions">
          <button class="theme-toggle" type="button" aria-label="Switch to night mode" title="Switch theme">
            <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"></path></svg>
            <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.2A8 8 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z"></path></svg>
          </button>
          <a href="index.html#work" class="case-nav-back"><span aria-hidden="true">&larr;</span> Selected Work</a>
        </div>
      </nav>
    </header>

    <main id="case-content" class="case-main">
      <section class="case-hero">
        <div class="case-heading">
          <p class="case-number" id="case-number"></p>
          <p class="case-type" id="case-type"></p>
          <h1 id="case-title"></h1>
          <p class="case-description" id="case-description"></p>
        </div>

        <dl class="case-meta">
          <div>
            <dt>Role</dt>
            <dd id="case-role"></dd>
          </div>
          <div>
            <dt>Tools</dt>
            <dd id="case-tools"></dd>
          </div>
        </dl>
      </section>

      <section class="moodboard-section" aria-label="Project gallery">
        <div class="moodboard" id="moodboard"></div>
      </section>

      <nav class="case-footer-nav" aria-label="More projects">
        <a href="index.html#work"><span aria-hidden="true">&larr;</span> Back to Selected Work</a>
        <a id="next-project" href="project.html?category=social">Next Project <span aria-hidden="true">&rarr;</span></a>
      </nav>
    </main>

    <footer>
      <a href="index.html" class="logo">CHADRICK<span>.</span></a>
      <p>&copy; <span id="current-year"></span> Chadrick. All rights reserved.</p>
      <a href="#case-content" class="back-to-top">Back to top &uarr;</a>
    </footer>

    <script src="theme.js"></script>
    <script src="project-page.js"></script>
  </body>
</html>
